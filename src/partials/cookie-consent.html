    <!-- Cookie consent. Hidden in the markup: cookie-consent.js shows it once a GA4 ID is set,
         because without one the site has no cookies to ask about. It sits right after the skip
         link so that a keyboard or a screen reader meets it first, before the menu. -->
    <section id="cookie-consent" class="cookie-consent" aria-labelledby="cookie-consent-title" hidden>
        <h2 id="cookie-consent-title" class="visually-hidden" data-i18n="cookie_title">Cookies</h2>
        <p class="cookie-consent__text">
            <span data-i18n="cookie_text">We use Google Analytics cookies to understand how the site is used. Only with your consent.</span>
            <a href="privacy.html" data-i18n="footer_privacy">Privacy Policy</a>
        </p>
        <div class="cookie-consent__actions">
            <button type="button" class="btn btn-secondary cookie-consent__btn" data-consent="denied" data-i18n="cookie_decline">Decline</button>
            <button type="button" class="btn btn-primary cookie-consent__btn" data-consent="granted" data-i18n="cookie_accept">Accept</button>
        </div>
    </section>
