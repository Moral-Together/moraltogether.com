---
nav: partnerships.html
styles: morals/moral.css
---
<!-- The page of one Moral. tools/build.mjs renders it once per entry in morals/morals.json,
     into morals/<slug>/index.html. The name and the description are translations.js strings
     (<key>_name, <key>_desc); the films, if the entry lists any, follow the card. A part the entry does not have is left out of the page. -->
<!-- @main -->
    <main id="main" class="moral-page" style="--card-accent: {{accent}};">
        <div class="container">
            <a href="partnerships.html" class="moral-back">
                <svg class="moral-back__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-i18n="nav_partnerships">Partnerships</span>
            </a>

            <article class="moral-card">
                <div class="moral-media">
{{logo}}
                </div>
                <div class="moral-body">
                    <h1 class="moral-name" data-i18n="{{key}}_name">{{name}}</h1>
{{desc}}
{{links}}
                </div>
            </article>

            <div class="moral-more">
                <!-- The Moral's project manager, beside the films (above them on phones). Until the real person is known: a faceless figure
                     and "Coming soon" for the name; the description is left out until there is one. -->
                <aside class="moral-manager">
                    <div class="moral-manager__photo" aria-hidden="true">
                        <svg viewBox="0 0 512 512" focusable="false"><path d="M8,491.376V452.48c0-55.112,63.2-134.4,181.928-140l7.624-0.36v-52.096l-4.048-2.296c-60.952-34.512-82.392-111.904-47.88-172.864S257.536,2.48,318.488,36.992s82.392,111.904,47.88,172.864c-11.328,20-27.872,36.552-47.88,47.880l-4.048,2.296v52.104l7.624,0.36C440.8,318.064,504,397.368,504,452.48v38.896H8z" fill="currentColor"/></svg>
                    </div>
                    <div class="moral-manager__body">
                        <h2 class="moral-manager__role" data-i18n="project_manager">Project manager</h2>
                        <p class="moral-manager__name" data-i18n="coming_soon">Coming soon</p>
                    </div>
                </aside>
{{videos}}
            </div>
        </div>
    </main>
