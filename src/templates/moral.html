---
nav: partnerships.html
styles: morals/moral.css
---
<!-- The page of one Moral. tools/build.mjs renders it once per entry in morals/morals.json,
     into morals/<slug>/index.html. The name and the description are translations.js strings
     (<key>_name, <key>_desc); a part the entry does not have is left out of the page. -->
<!-- @main -->
    <main id="main" class="moral-page" style="--card-accent: {{accent}};">
        <div class="container">
            <a href="partnerships.html" class="moral-back">
                <svg class="moral-back__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-i18n="nav_partnerships">Partnerships</span>
            </a>

            <article class="moral-card">
                <div class="moral-media">
{{logo}}
                </div>
                <div class="moral-body">
                    <h1 class="moral-name" data-i18n="{{key}}_name">{{name}}</h1>
{{desc}}
{{links}}
                </div>
            </article>
        </div>
    </main>
